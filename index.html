<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuiLabs — Mui uygulamaları</title>
    <meta
      name="description"
      content="Mui ailesinin bütün uygulamaları tek yerde: indir, aç, mağazaya git."
    />
    <meta name="theme-color" content="#0f1115" />

    <!--
      Favicon, public/icons/muilabs.svg ile AYNI çizim. İkisi birlikte değişir.
      Gömülü data URI: vitrin ilk boyamada ek bir istek yapmasın.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Cg fill='none' stroke='%232dd4bf' stroke-width='2.4' stroke-linejoin='round'%3E%3Crect x='7.2' y='7.2' width='7.6' height='7.6' rx='2.2'/%3E%3Crect x='17.2' y='7.2' width='7.6' height='7.6' rx='2.2'/%3E%3Crect x='7.2' y='17.2' width='7.6' height='7.6' rx='2.2'/%3E%3C/g%3E%3Crect x='17.2' y='17.2' width='7.6' height='7.6' rx='2.2' fill='%232dd4bf'/%3E%3C/svg%3E"
    />

    <!--
      Sosyal önizleme.

      og:image MUTLAK adres olmak zorunda: kartı çizen taraf (Discord, X,
      WhatsApp) sayfayı sunucudan çekip mutlak URL bekliyor, göreli yol orada
      çözülmüyor. Adres Pages dağıtımına sabit — Tauri penceresinde bu
      etiketlerin bir karşılığı yok, zararı da yok.

      Görselin kaynağı tools/social-preview.html; yeniden üretme komutu o
      dosyanın içinde. Ürün eklenip karttaki sayı eskiyince yeniden üretilmeli.
    -->
    <link rel="canonical" href="https://heraklessii.github.io/MuiLabs/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MuiLabs" />
    <meta property="og:title" content="MuiLabs — Mui uygulamaları" />
    <meta
      property="og:description"
      content="Mui ailesinin bütün uygulamaları tek yerde: indir, aç, mağazaya git."
    />
    <meta property="og:url" content="https://heraklessii.github.io/MuiLabs/" />
    <meta
      property="og:image"
      content="https://heraklessii.github.io/MuiLabs/social-preview.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="MuiLabs: bütün Mui uygulamaları tek yerde"
    />
    <meta property="og:locale" content="tr_TR" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
