[package]
name = "muilabs"
version = "0.1.0"
description = "Mui uygulamalarinin vitrini"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 sozlesmesi: asil kod kutuphanede, main.rs yalniz onu cagiriyor.
name = "muilabs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Indirme: akis halinde diske yaziyoruz, dosyayi bellekte tutmuyoruz.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
# Vitrin kucuk bir uygulama; boyut hizdan onemli.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
