<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    MuiLabs uygulama ikonunun KAYNAĞI.

    Buradaki her PNG (icon.png, icon.ico, Square*Logo.png ...) bu dosyadan
    üretiliyor. İkonu değiştirmek isteyen önce burayı düzenler, sonra:

        npx tauri icon src-tauri/icons/kaynak.svg

    Komut Windows dışı hedefler de üretir (android/, ios/, icon.icns);
    MuiLabs şimdilik yalnız nsis+msi paketlediği için onlar silinir.

    Glyph, `public/icons/muilabs.svg` ve `index.html` favicon'uyla AYNI yol;
    sadece 32'lik ızgaradan 1024'e ölçeklenmiş hâli (çarpan 32). Üçünden biri
    değişirse diğer ikisi de değişmeli.

    Kare/gradyan iskeleti Mui ailesinden (Muiget, Muivly, Muifly) geliyor:
    aynı köşe yarıçapı, aynı koyu zemin, aynı teal vurgu.

    Glyph neden ızgara: MuiLabs'ın işi bir şey yapmak değil, yapılmış şeyleri
    yan yana koymak. Dolu olan dördüncü kare seçilen uygulama.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b232c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="cizgi" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#zemin)"/>

  <!-- 32'lik ızgarada: x/y 7.2 ve 17.2, kenar 7.6, yarıçap 2.2, kontur 2.4 -->
  <g fill="none" stroke="url(#cizgi)" stroke-width="76.8" stroke-linejoin="round">
    <rect x="230.4" y="230.4" width="243.2" height="243.2" rx="70.4"/>
    <rect x="550.4" y="230.4" width="243.2" height="243.2" rx="70.4"/>
    <rect x="230.4" y="550.4" width="243.2" height="243.2" rx="70.4"/>
  </g>
  <rect x="550.4" y="550.4" width="243.2" height="243.2" rx="70.4" fill="url(#cizgi)"/>
</svg>
