name: Release

# `v` ile baslayan bir etiket itilince Windows kurulum paketlerini derleyip
# GitHub Release'ine yukler. Etiketi elle atmak bilincli: her commit'te surum
# yayinlamak bir vitrin uygulamasi icin gurultu olur.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Windows kurulum paketleri
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MuiLabs ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
